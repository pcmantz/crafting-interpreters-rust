# mise.toml

[tools]
rust = "latest"

"cargo:cargo-tarpaulin" = "latest"

[task_config]
includes = ["bin"]

[tasks.build]
run = 'cargo build'

[tasks.test]
description = "run unit tests"
run = "cargo test"

[tasks.coverage]
description = "generate test coverage report"
run = "cargo tarpaulin"

[tasks.lox]
description = "run the lox binary"
run = "cargo run --bin lox"

[tasks.lox-ast]
description = "run the lox binary"
run = "cargo run --bin lox-ast"
